<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signal Desk — volume &amp; technical models</title>
  <meta name="description" content="AI-styled market signal desk for Nifty universes: volume bias and technical models.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Sora:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <aside class="rail" aria-label="Workspaces">
      <div class="rail-head">
        <div class="rail-mark" title="Signal Desk" aria-label="Signal Desk">
          <svg viewBox="0 0 32 32" width="20" height="20" aria-hidden="true">
            <rect x="4" y="18" width="5" height="10" rx="1.5" fill="currentColor" opacity="0.45"/>
            <rect x="11" y="11" width="5" height="17" rx="1.5" fill="currentColor" opacity="0.7"/>
            <rect x="18" y="6" width="5" height="22" rx="1.5" fill="currentColor"/>
            <rect x="25" y="13" width="5" height="15" rx="1.5" fill="currentColor" opacity="0.55"/>
          </svg>
        </div>
      </div>
      <nav class="rail-nav">
        <button type="button" class="rail-link is-on" data-desk="volume" title="Volume" aria-label="Volume">
          <svg class="rail-ico" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M3 12h2.5l2-6 3 12 2.5-8L16 14h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button type="button" class="rail-link" data-desk="tech" title="Technical" aria-label="Technical">
          <svg class="rail-ico" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M5 18V9M10 18V6M15 18v-7M20 18V4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M4 20h16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
          </svg>
        </button>
        <button type="button" class="rail-link" data-desk="sci" title="Lab" aria-label="Lab">
          <svg class="rail-ico" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M9 3h6M10 3v5.2L5.8 18.2A2.4 2.4 0 0 0 8 21.5h8a2.4 2.4 0 0 0 2.2-3.3L13.9 8.2V3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M8.2 14.5h7.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
          </svg>
        </button>
      </nav>
    </aside>

    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="eyebrow" title="Engine online"><span class="pulse" aria-hidden="true"></span><span class="sr-only">Engine online</span></span>
          <h1 class="wordmark" id="desk-title" title="Volume signals">
            <svg class="desk-ico" data-desk-ico="volume" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path d="M3 12h2.5l2-6 3 12 2.5-8L16 14h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <svg class="desk-ico" data-desk-ico="tech" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" hidden>
              <path d="M5 18V9M10 18V6M15 18v-7M20 18V4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M4 20h16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
            </svg>
            <svg class="desk-ico" data-desk-ico="sci" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" hidden>
              <path d="M9 3h6M10 3v5.2L5.8 18.2A2.4 2.4 0 0 0 8 21.5h8a2.4 2.4 0 0 0 2.2-3.3L13.9 8.2V3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M8.2 14.5h7.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
            </svg>
            <span class="sr-only" id="desk-title-text">Volume signals</span>
          </h1>
        </div>

        <div class="top-actions">
          <form id="search-form" class="search" role="search">
            <label class="sr-only" for="q">Search symbol</label>
            <input id="q" name="q" type="search" placeholder="RELIANCE, TCS…" autocomplete="off" enterkeyhint="search">
            <button type="submit" title="Run" aria-label="Run">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                <path d="M8 5.5v13l11-6.5-11-6.5z" fill="currentColor"/>
              </svg>
            </button>
          </form>
        </div>
      </header>
      <div id="suggestions" class="suggestions" hidden></div>

      <div class="toolbar">
        <p id="status" class="status" role="status">Warming…</p>
        <div class="toolbar-filters">
          <details class="ind-filter" id="tech-ind-filter" hidden>
            <summary id="tech-ind-summary" title="Signal set">
              <svg class="ctrl-ico" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
                <circle cx="6" cy="8" r="2.2" fill="currentColor"/>
                <circle cx="12" cy="12" r="2.2" fill="currentColor"/>
                <circle cx="18" cy="7" r="2.2" fill="currentColor"/>
                <circle cx="9" cy="17" r="2.2" fill="currentColor" opacity="0.55"/>
                <circle cx="16" cy="17" r="2.2" fill="currentColor" opacity="0.55"/>
              </svg>
              <span id="tech-ind-count">Σ</span>
            </summary>
            <div class="ind-filter-panel">
              <div id="tech-ind-list" class="ind-filter-list" role="group" aria-label="Technical signal set"></div>
              <div class="ind-filter-actions">
                <button type="button" id="tech-ind-all" title="All">∀</button>
                <button type="button" id="tech-ind-none" title="Clear">∅</button>
                <button type="button" id="tech-ind-apply" class="is-primary" title="Apply">✓</button>
              </div>
            </div>
          </details>
          <label class="universe-label" for="universe" title="Universe">
            <svg class="ctrl-ico" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
              <circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
              <ellipse cx="12" cy="12" rx="3.5" ry="8.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
              <path d="M3.5 12h17" stroke="currentColor" stroke-width="1.4"/>
            </svg>
            <select id="universe" aria-label="Universe">
              <option value="nifty50" selected>N50</option>
              <option value="nifty500">N500</option>
              <option value="all">ALL</option>
            </select>
          </label>
        </div>
      </div>

      <div class="tf-row" id="tf-row">
        <div id="tf-bar" class="windows" role="group" aria-label="Horizon">
          <button type="button" data-tf="15m">15M</button>
          <button type="button" data-tf="1h">1H</button>
          <button type="button" data-tf="4h">4H</button>
          <button type="button" data-tf="1d" class="is-on">1D</button>
          <button type="button" data-tf="1w">1W</button>
          <button type="button" data-tf="1m">1M</button>
          <button type="button" data-tf="3m">3M</button>
          <button type="button" data-tf="6m">6M</button>
          <button type="button" data-tf="1y">1Y</button>
          <button type="button" data-tf="5y">5Y</button>
          <button type="button" data-tf="max">MAX</button>
        </div>
      </div>

      <div class="meta-row">
        <details class="meta-fold" id="legend-fold">
          <summary title="Model rules">
            <svg class="ctrl-ico" viewBox="0 0 24 24" width="13" height="13" aria-hidden="true">
              <path d="M12 3.5 4.5 7v5.2c0 4.4 3.2 7.6 7.5 8.8 4.3-1.2 7.5-4.4 7.5-8.8V7L12 3.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
              <path d="M9.2 12.1 11 14l3.8-4.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="sr-only">Model rules</span>
          </summary>
          <div id="formula-panel" class="formula-strip" aria-label="Model rules"></div>
        </details>
        <details class="meta-fold" id="source-fold">
          <summary title="Feeds">
            <svg class="ctrl-ico" viewBox="0 0 24 24" width="13" height="13" aria-hidden="true">
              <path d="M4 12a8 8 0 0 1 16 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              <path d="M7 12a5 5 0 0 1 10 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              <circle cx="12" cy="12" r="1.6" fill="currentColor"/>
            </svg>
            <span class="sr-only">Feeds</span>
          </summary>
          <div id="source-panel" class="source-panel" aria-label="Data feeds"></div>
        </details>
      </div>

      <main class="stage">
        <div id="tabs" class="tabs" role="tablist" aria-label="Signal views"></div>
        <div id="panel" class="panel" aria-live="polite"></div>
      </main>

      <footer class="foot">
        <p id="foot-text">Research only · not advice.</p>
      </footer>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
